name: paper-trade

# Runs every hour. Each longshot variant (see VARIANTS in kalshi_weather/longshot.py)
# only trades the cities where it is currently that variant's local hour, matching
# the backtest. The ledger (ledger/paper.db) is committed back to the repo.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  issues: write
  id-token: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Settle finished trades, then paper-trade longshots
        run: |
          python -m kalshi_weather --data ledger settle
          python -m kalshi_weather --data ledger paper --strategy longshot --scheduled
          python -m kalshi_weather --data ledger paper --strategy maker --scheduled
          python -m kalshi_weather --data ledger paper --strategy poly || echo "Polymarket paper step failed"
          python -m kalshi_weather --data ledger paper --strategy lip || echo "LIP paper step failed"
          python -m kalshi_weather --data ledger report
          python -m kalshi_weather --data ledger brain --alerts alerts.txt
          if [ "$(date -u +%H)" = "23" ]; then
            python -m kalshi_weather --data ledger etf || echo "ETF update failed (price source down?)"
          fi
      - name: Open an issue if the brain stopped a strategy
        if: hashFiles('alerts.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s alerts.txt ]; then
            gh issue create --title "Brain stopped a strategy" --body-file alerts.txt
          fi
      - name: Save ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/paper.db
          git diff --cached --quiet || (git commit -m "Update paper ledger" && git pull --rebase && git push)
      - name: Build dashboard
        run: |
          if git fetch -q --depth 1 origin data; then git worktree add -q --detach store FETCH_HEAD; fi
          python -m kalshi_weather --data ledger dashboard --out site/index.html --store store \
            --repo-url "https://github.com/${{ github.repository }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
