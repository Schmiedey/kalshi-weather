name: paper-trade

# Runs hourly 19:07-23:07 UTC. That window contains 3pm local for every city in
# both summer and winter time; the bot only trades cities where it is 3pm right now,
# matching the backtest. The ledger (ledger/paper.db) is committed back to the repo.
on:
  schedule:
    - cron: "7 19-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Settle finished trades, then paper-trade longshots
        run: |
          python -m kalshi_weather --data ledger settle
          python -m kalshi_weather --data ledger paper --strategy longshot --at-local-hour 15
          python -m kalshi_weather --data ledger report
      - name: Save ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/paper.db
          git diff --cached --quiet || (git commit -m "Update paper ledger" && git pull --rebase && git push)
